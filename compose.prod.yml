services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: usetenth
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: usetenth
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Reachable only from the server itself (use an SSH tunnel to run migrations).
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usetenth"]
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    # Only Caddy can reach the app; it is not published on the internet.
    expose:
      - "3000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
