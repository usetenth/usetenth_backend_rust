[package]
name = "usetenth-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "macros", "derive", "chrono", "uuid"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = {version = "1", features = ["derive"]}
axum = {version = "0.8", features = ["macros"]}
serde_json = "1"
dotenvy = "0.15.7"
anyhow = "1.0.104"
ngrok = "0.19.0"
thiserror = "2"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
url = "2.5.8"
uuid = { version = "1.29.0", features = ["v4", "serde"] }
p256 = { version = "0.13", features = ["ecdsa", "jwk"] }
chrono = {version = "0.4.45", features = ["serde"]}
base64 = "0.21.7"
hpke = "0.12"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
aes-gcm = "0.10"
zeroize = "1"
argon2 = "0.5"
jsonwebtoken = "9"
bs58 = "0.5"
sha3 = "0.10"
hmac = "0.12"
unicode-normalization = "0.1"
