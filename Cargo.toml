[package]
name = "usetenth-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
sqlx = {version = "0.8", features = ["runtime-tokio-rustls", "postgres", "macros", "derive"]}
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = {version = "1", features = ["derive"]}
axum = "0.8"
serde_json = "1"
dotenvy = "0.15.7"
anyhow = "1.0.104"
ngrok = "0.19.0"
thiserror = "2"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
url = "2.5.8"
uuid = { version = "1.29.0", features = ["v4", "serde"] }
p256 = { version = "0.13", features = ["ecdsa", "jwk"] }
chrono = {version = "0.4.45", features = ["serde"]}
base64 = "0.21.7"
